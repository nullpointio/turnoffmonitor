ShortDescription: Turn off your monitors with one hotkey. Small single exe, no installer, no runtime.
Description: A tray utility that turns the monitors off on Ctrl+Alt+M using the documented SC_MONITORPOWER message. Supports
  -off, -lock, -toggle, a custom hotkey and an optional start-with-Windows entry. 58 KB single exe, no drivers and no admin
  rights.
